@if (imageUrl && !imageFailed) {
    <img [src]="imageUrl" [alt]="alt" [class.loaded]="imageLoaded" (load)="onLoad()" (error)="onError()" />
}
@if (!imageUrl || imageFailed || !imageLoaded) {
    <span class="placeholder" role="img" [attr.aria-label]="alt || 'Ürün görseli bulunmuyor'">
        <i class="pi pi-image" aria-hidden="true"></i>
    </span>
}
